<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand" routerLink="/trips">{{ title }}</a>
    <div class="navbar-nav flex-row gap-2">
      <a class="nav-link" routerLink="/trips" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        Trips
      </a>
      @if (auth.isLoggedIn$ | async) {
        <a class="nav-link" routerLink="/trips/new" routerLinkActive="active">Add</a>
      }
    </div>
    <div class="d-flex align-items-center gap-2">
      @if (auth.isLoggedIn$ | async) {
        <button class="btn btn-outline-secondary btn-sm" type="button" (click)="auth.logout()">
          Logout
        </button>
      } @else {
        <a class="btn btn-primary btn-sm" routerLink="/login">Login</a>
      }
    </div>
  </div>
</nav>

<main class="container py-4">
  <router-outlet></router-outlet>
</main>
