<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h4 mb-1">Admin login</h2>
        <div class="text-muted small mb-3">Sign in to manage trips.</div>

        @if (errorMessage) {
          <div class="alert alert-danger">{{ errorMessage }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" class="form-control" type="email" formControlName="email" />
            @if (form.controls.email.touched && form.controls.email.invalid) {
              <div class="text-danger small mt-1">A valid email is required.</div>
            }
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input id="password" class="form-control" type="password" formControlName="password" />
            @if (form.controls.password.touched && form.controls.password.invalid) {
              <div class="text-danger small mt-1">Password is required.</div>
            }
          </div>

          <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
            @if (loading) { Signing in… } @else { Sign in }
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
